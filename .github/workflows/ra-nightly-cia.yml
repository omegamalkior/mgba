name: RetroArch 3DS nightly CIA (stock mGBA + gpSP)
on:
  push:
    branches: [ci/3ds-split-check]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {core: mgba, repo: libretro/mgba, mk: "mkdir -p b && cd b && cmake .. -DCMAKE_TOOLCHAIN_FILE=../src/platform/3ds/CMakeToolchain.txt -DBUILD_LIBRETRO=ON -DLIBRETRO_STATIC=ON -DSKIP_LIBRARY=ON -DBUILD_QT=OFF -DBUILD_SDL=OFF -DCMAKE_BUILD_TYPE=Release && make mgba_libretro", lib: mgba_libretro}
          - {core: gpsp, repo: libretro/gpsp, mk: "make platform=ctr", lib: gpsp_libretro}
    steps:
      - name: Sources (latest master = nightly)
        run: |
          git clone -q --depth 1 https://github.com/libretro/RetroArch ra
          git clone -q --depth 1 https://github.com/${{ matrix.repo }} core
          echo "RA $(git -C ra log -1 --format='%h %cd')" > info.txt
          echo "${{ matrix.core }} $(git -C core log -1 --format='%h %cd')" >> info.txt
          cat info.txt
      - name: Build core
        run: |
          export CTRULIB=$DEVKITPRO/libctru
          cd core && ( ${{ matrix.mk }} -j4 ) >../core.log 2>&1 || (tail -40 ../core.log; exit 1)
          cd $GITHUB_WORKSPACE && find core -name '${{ matrix.lib }}*.a' | tee -a core.log
      - name: Build RetroArch CIA
        run: |
          cp "$(find core -name '${{ matrix.lib }}*.a' | head -1)" ra/libretro_ctr.a
          cd ra && chmod +x pkg/ctr/tools/*-linux || true
          make -f Makefile.ctr LIBRETRO=${{ matrix.core }} -j4 >../ra.log 2>&1 || (tail -40 ../ra.log; exit 1)
          ls -la retroarch_3ds.cia
          mkdir -p ../out && cp retroarch_3ds.cia ../out/${{ matrix.core }}_libretro.cia && cp ../info.txt ../out/${{ matrix.core }}_info.txt
      - name: Keep logs
        if: always()
        run: |
          mkdir -p out; for f in core.log ra.log info.txt; do [ -f $f ] && tail -150 $f > out/${{ matrix.core }}_$f || true; done
          ls core >> out/${{ matrix.core }}_files.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.core }}
          path: out/
  publish:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: res
          merge-multiple: true
      - run: |
          ls -la res
          cd res && git init -q && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "stock RetroArch 3DS nightly CIAs (test only)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci/3ds-split-results
